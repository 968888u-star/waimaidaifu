<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BMW团队开发搭建</title>
    <style>
        /* 基础重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f9; /* 背景浅灰蓝色 */
            color: #333;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* 限制最大宽度，模拟手机端展示 */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #f0f4f9;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        /* 顶部 Banner 占位 */
        .banner {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #ff9a44, #fc6076); /* 渐变模拟背景 */
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 滚动公告栏 */
        .notice-bar {
            background-color: #fffaf0;
            color: #d4822b;
            padding: 8px 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #ffe8cc;
            overflow: hidden;
            white-space: nowrap;
        }
        
        .notice-bar .icon {
            margin-right: 6px;
            font-size: 14px;
        }
        
        .marquee-text {
            animation: marquee 15s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 区块标题 */
        .section-title {
            font-size: 15px;
            font-weight: bold;
            padding: 15px 15px 10px;
            display: flex;
            align-items: center;
            color: #333;
        }
        
        .section-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 14px;
            background-color: #3b82f6; /* 标题左侧蓝色小竖条 */
            margin-right: 8px;
            border-radius: 2px;
        }

        /* 联系招商经理区块 */
        .contact-section {
            padding: 0 15px;
        }

        .contact-cards {
            display: flex;
            gap: 10px;
        }

        .contact-card {
            flex: 1;
            background: #fff;
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .contact-left {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #555;
        }

        .contact-icon {
            width: 20px;
            height: 20px;
            margin-right: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
        }
        
        .icon-tg { background-color: #24A1DE; }
        .icon-wx { background-color: #07C160; }

        .copy-icon {
            color: #3b82f6;
            margin-left: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-contact {
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            color: #fff;
            border: none;
            border-radius: 15px;
            padding: 4px 12px;
            font-size: 12px;
            cursor: pointer;
        }

        /* 品牌矩阵区块 */
        .brand-section {
            padding: 0 15px;
        }

        .brand-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .brand-card {
            background: #fff;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0; /* 防止文字溢出撑破容器 */
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #f8f9fa;
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-register {
            background-color: #ff4d4f;
            color: #fff;
            border: none;
            border-radius: 15px;
            padding: 4px 8px;
            font-size: 11px;
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 5px;
        }

        /* 底部文字 */
        .footer-text {
            text-align: center;
            color: #999;
            font-size: 12px;
            padding: 30px 0 20px;
        }
    </style>
</head>
<body>
