    deliveryFee: 2, minOrder: 15,
    categories: [
      { name: '人气推荐', items: [
        { id: 'b1', name: '杨枝甘露', desc: '芒果西柚西米露', price: 19, emoji: '🥭' },
        { id: 'b2', name: '芋泥波波奶茶', desc: '荔浦芋头 · 现煮波波', price: 17, emoji: '🧋' },
        { id: 'b3', name: '茉莉奶绿', desc: '清香茉莉 · 醇厚奶香', price: 14, emoji: '🍵' }
      ]},
      { name: '小食', items: [
        { id: 'b4', name: '芝士红薯', desc: '拉丝芝士 · 现烤', price: 12, emoji: '🍠' },

  },
  {

    rating: 4.6, monthSales: 1832, deliveryTime: '25分钟', distance: '2.1km',
    deliveryFee: 4, minOrder: 25,
    categories: [
      { name: '汉堡', items: [
        { id: 'h1', name: '双层牛肉堡', desc: '双层安格斯牛肉饼', price: 32, emoji: '🍔' },
        { id: 'h2', name: '香辣鸡腿堡', desc: '整块鸡腿肉', price: 22, emoji: '🍔' }
      ]},
      { name: '炸物', items: [

        { id: 'h4', name: '炸鸡桶（4块）', desc: '外酥里嫩', price: 39, emoji: '🍗' }
      ]}
    ]
  }
];

/* =========================================================
   状态
   ========================================================= */
const STORE_KEY = 'mt_takeout_v2';

function defaultState() {
  return {
    settings: {
      payAddressName: '商户收款账户',
      payAddress: '0x742d35Cc6634C0532925a3b844Bc454e4438f44e',
      receiver: { name: '张三', phone: '138 8888 8888', address: '阳光小区 3 栋 502 室' }
    },
    cart: { shopId: null, items: {} },
    payMethod: 'self',
    orders: []
  };
}

let S = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultState();
    const s = JSON.parse(raw);
    const d = defaultState();
    if (!s.settings) s.settings = d.settings;
    if (!s.settings.receiver) s.settings.receiver = d.settings.receiver;
    if (!s.cart) s.cart = d.cart;
    if (!s.orders) s.orders = [];
    if (!s.payMethod) s.payMethod = 'self';
    return s;
  } catch (e) { return defaultState(); }
}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
}

/* 同浏览器多标签同步 */
window.addEventListener('storage', (e) => {
  if (e.key === STORE_KEY) {
    S = loadState();
    render(true);
  }
});

/* =========================================================
   工具
   ========================================================= */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 1900);
}

function go(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}

function baseUrl() {
  return location.href.split('#')[0];
}

function genOrderId() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}${Math.floor(Math.random() * 9000 + 1000)}`;
}

function fmtTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function findShop(id) { return SHOPS.find(s => s.id === id); }

function findItem(shopId, itemId) {
  const shop = findShop(shopId);
  if (!shop) return null;
  for (const cat of shop.categories) {
    const it = cat.items.find(i => i.id === itemId);
    if (it) return it;
  }
  return null;
}

function calcSubtotal(shopId, cart) {
  let sum = 0;
  for (const [itemId, qty] of Object.entries(cart)) {
    const it = findItem(shopId, itemId);
    if (it) sum += it.price * qty;
  }
  return sum;
}

/* =========================================================
   链接编解码（跨设备关键）
   使用 base64url 承载完整订单数据
   ========================================================= */
function encodeData(obj) {
  try {
    const json = JSON.stringify(obj);
    const bytes = new TextEncoder().encode(json);
    let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  } catch (e) { return ''; }
}

function decodeData(str) {
  try {
    let b64 = String(str).replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) { return null; }
}

/* 内部订单 → 精简分享数据 */
function serializeOrder(o) {
  return {
    v: 1,
    id: o.id,
    sn: o.shopName,
    se: o.shopEmoji,
    it: o.items.map(i => ({ n: i.name, p: i.price, q: i.qty, m: i.emoji })),
    df: o.deliveryFee,
    tt: o.total,
    pa: o.payAddress,
    pn: o.payAddressName,
    rc: { n: o.receiver.name, ph: o.receiver.phone, ad: o.receiver.address },
    ct: o.createdAt
  };
}

/* 分享数据 → 渲染用订单对象 */
function deserializeOrder(d) {
  return {
    id: d.id,
    shopName: d.sn,
    shopEmoji: d.se,
    items: (d.it || []).map(i => ({ name: i.n, price: i.p, qty: i.q, emoji: i.m })),
    deliveryFee: Number(d.df) || 0,
    total: Number(d.tt) || 0,
    payAddress: d.pa,
    payAddressName: d.pn,
    receiver: { name: d.rc ? d.rc.n : '', phone: d.rc ? d.rc.ph : '', address: d.rc ? d.rc.ad : '' },
    createdAt: d.ct
  };
}

function payHashFor(order) {
  return '#/pay/' + encodeData(serializeOrder(order));
}

function receiptDataFor(order) {
  return {
    v: 1,
    oid: order.id,
    tt: order.total,
    sn: order.shopName,
    se: order.shopEmoji,
    pa: order.payAddress,
    pn: order.payAddressName,
    at: order.paidAt || Date.now()
  };
}

function receiptHashFor(order) {
  return '#/receipt/' + encodeData(receiptDataFor(order));
}

/* =========================================================
   复制
   ========================================================= */
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => toast('已复制到剪贴板'),
      () => fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('已复制到剪贴板'); }
  catch (e) { toast('复制失败，请长按选择复制'); }
  document.body.removeChild(ta);
}

/* =========================================================
   购物车
   ========================================================= */
function incItem(shopId, itemId) {
  if (S.cart.shopId !== shopId) { S.cart.shopId = shopId; S.cart.items = {}; }
  S.cart.items[itemId] = (S.cart.items[itemId] || 0) + 1;
  save();
  render(true);
}

function decItem(shopId, itemId) {
  const items = S.cart.items;
  if (!items[itemId]) return;
  items[itemId]--;
  if (items[itemId] <= 0) delete items[itemId];
  if (Object.keys(items).length === 0) S.cart.shopId = null;
  save();
  render(true);
}

function setPayMethod(m) {
  S.payMethod = m;
  save();
  render(true);
}

/* =========================================================
   下单
   ========================================================= */
function submitOrder() {
  const shopId = S.cart.shopId;
  const shop = findShop(shopId);
  if (!shop) { toast('购物车为空'); return; }

  const cart = S.cart.items;
  const subtotal = calcSubtotal(shopId, cart);
  if (subtotal < shop.minOrder) { toast('未达起送价'); return; }

  const items = Object.entries(cart).map(([itemId, qty]) => {
    const it = findItem(shopId, itemId);
    return { id: itemId, name: it.name, price: it.price, qty, emoji: it.emoji };
  });

  const order = {
    id: genOrderId(),
    shopId: shop.id,
    shopName: shop.name,
    shopEmoji: shop.emoji,
    items,
    subtotal,
    deliveryFee: shop.deliveryFee,
    total: subtotal + shop.deliveryFee,
    status: 'unpaid',
    payMethod: S.payMethod || 'self',
    payAddress: S.settings.payAddress,
    payAddressName: S.settings.payAddressName,
    receiver: Object.assign({}, S.settings.receiver),
    createdAt: Date.now(),
    paidAt: null,
    role: 'owner'
  };

  S.orders.unshift(order);
  S.cart = { shopId: null, items: {} };
  save();

  if (order.payMethod === 'friend') go('#/share/' + order.id);
  else go(payHashFor(order));
}

function openPay(orderId) {

/* 从订单页复制代付链接 */
function copyPayLink(orderId) {

  if (!o) return toast('订单不存在');
  copyText(baseUrl() + payHashFor(o));
}

/* 从订单页复制回执链接 */
function copyReceiptLink(orderId) {

  if (!o) return toast('订单不存在');
  copyText(baseUrl() + receiptHashFor(o));

/* 付款页支付动作 */
let currentShare = null;

function doPay() {
  if (!currentShare) return toast('订单数据异常');
  const order = deserializeOrder(currentShare);
  const now = Date.now();

  const local = S.orders.find(o => o.id === order.id);
  if (local) {
    if (local.status === 'unpaid') {
      local.status = 'paid';
      local.paidAt = now;
    }
  } else {
    // 代付方本地留一条记录
    S.orders.unshift({
      id: order.id,
      shopId: '',
      shopName: order.shopName,
      shopEmoji: order.shopEmoji,
      items: order.items.map(i => ({ id: '', name: i.name, price: i.price, qty: i.qty, emoji: i.emoji })),
      subtotal: order.items.reduce((a, i) => a + i.price * i.qty, 0),
      deliveryFee: order.deliveryFee,
      total: order.total,
      status: 'paid',
      payMethod: 'friend',
      payAddress: order.payAddress,
      payAddressName: order.payAddressName,
      receiver: order.receiver,
      createdAt: order.createdAt,
      paidAt: now,
      role: 'payer'
    });
  }
  save();

  const receipt = {
    v: 1, oid: order.id, tt: order.total,
    sn: order.shopName, se: order.shopEmoji,
    pa: order.payAddress, pn: order.payAddressName, at: now
  };
  go('#/receipt/' + encodeData(receipt));
}

/* 回执页复制链接 */
function copyReceiptEncoded(encoded) {
  copyText(baseUrl() + '#/receipt/' + encoded);
}

/* 回执页复制代付链接（再发给别人） */
function copyPayFromReceipt(encoded) {
  const r = decodeData(encoded);
  if (!r) return;
  const o = S.orders.find(x => x.id === r.oid);
  if (o) copyPayLink(o.id);
  else toast('本地无此订单');
}

/* =========================================================
   设置
   ========================================================= */
function updateSetting(path, value) {
  const keys = path.split('.');
  let obj = S.settings;
  for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
  obj[keys[keys.length - 1]] = value;
  save();
}

function resetAll() {
  if (!confirm('确定清空所有订单、购物车和设置吗？')) return;
  localStorage.removeItem(STORE_KEY);
  S = defaultState();
  toast('已重置');
  go('#/');
}

/* =========================================================
   渲染
   ========================================================= */
function render(keepScroll) {
  const y = keepScroll ? window.scrollY : 0;
  const hash = location.hash || '#/';
  const parts = hash.slice(1).split('/').filter(Boolean);
  const root = parts[0] || 'home';

  let html = '';
  let showTab = false;

  switch (root) {
    case 'home':     html = renderHome();          showTab = true; break;
    case 'shop':     html = renderShop(parts[1]);  break;
    case 'checkout': html = renderCheckout();      break;
    case 'share':    html = renderShare(parts[1]); break;
    case 'pay':      html = renderPay(parts[1]);   break;
    case 'receipt':  html = renderReceipt(parts[1]); break;
    case 'orders':   html = renderOrders();        showTab = true; break;
    case 'settings': html = renderSettings();      showTab = true; break;
    default:         html = renderHome();          showTab = true;
  }

  document.getElementById('app').innerHTML = html + (showTab ? renderTabbar(root) : '');
  window.scrollTo(0, y);
}

function renderTabbar(active) {
  const tabs = [
    { key: 'home',     label: '首页', icon: '🏠', hash: '#/' },
    { key: 'orders',   label: '订单', icon: '📋', hash: '#/orders' },
    { key: 'settings', label: '设置', icon: '⚙️', hash: '#/settings' }
  ];
  return `<div class="tabbar">${tabs.map(t => `
    <div class="tab ${active === t.key ? 'active' : ''}" onclick="go('${t.hash}')">
      <div class="tab-ico">${t.icon}</div>
      <div class="tab-label">${t.label}</div>
    </div>`).join('')}</div>`;
}

/* ---------- 店铺页 ---------- */
function renderShop(shopId) {
  const shop = findShop(shopId);
  if (!shop) return `<div class="empty-page">店铺不存在</div>`;

  const cart = (S.cart.shopId === shopId) ? S.cart.items : {};
  const count = Object.values(cart).reduce((a, b) => a + b, 0);

  let menuHtml = '';
  shop.categories.forEach(cat => {
    menuHtml += `<div class="cat-title">${esc(cat.name)}</div>`;
    cat.items.forEach(it => {
      const qty = cart[it.id] || 0;
      menuHtml += `
        <div class="dish">
          <div class="dish-img">${it.emoji}</div>
          <div class="dish-body">
            <div class="dish-name">${esc(it.name)}</div>
            <div class="dish-desc">${esc(it.desc)}</div>
            <div class="dish-price">¥${it.price}</div>
          </div>
          <div class="qty-ctrl">
            ${qty > 0 ? `<button class="qty-btn minus" onclick="decItem('${shop.id}','${it.id}')">−</button>` : ''}
            ${qty > 0 ? `<span class="qty-num">${qty}</span>` : ''}
            <button class="qty-btn plus" onclick="incItem('${shop.id}','${it.id}')">+</button>
          </div>
        </div>`;
    });
  });

  const subtotal = calcSubtotal(shopId, cart);
  const total = subtotal > 0 ? subtotal + shop.deliveryFee : 0;
  const canOrder = subtotal >= shop.minOrder;
  const diff = (shop.minOrder - subtotal).toFixed(2);

  const btnAttr = canOrder ? `onclick="go('#/checkout')"` : `onclick="toast('还差 ¥${diff} 起送')"`;
  const btnText = canOrder ? '去结算' : `差 ¥${diff} 起送`;

  return `
  <div class="header-bar">
    <button class="back-btn" onclick="go('#/')">‹</button>
    <span style="font-size:15px">${esc(shop.name)}</span>
  </div>
  <div class="shop-banner">
    <div class="shop-banner-emoji">${shop.emoji}</div>
    <div class="shop-banner-name">${esc(shop.name)}</div>
    <div class="shop-banner-meta">★ ${shop.rating} · 月售 ${shop.monthSales} · ${shop.deliveryTime} · 配送 ¥${shop.deliveryFee}</div>
  </div>
  <div class="menu">${menuHtml}</div>
  ${count > 0 ? `
    <div class="cart-bar">
      <div class="cart-left" onclick="go('#/checkout')">
        <div class="cart-ico">🛒<span class="cart-badge">${count}</span></div>
        <div class="cart-price">¥${total.toFixed(2)}</div>
      </div>
      <button class="cart-btn ${canOrder ? '' : 'disabled'}" ${btnAttr}>${btnText}</button>
    </div>` : ''}`;
}

  const o = deserializeOrder(decoded);

  // 本地已有该订单且已支付
  const local = S.orders.find(x => x.id === o.id);
  if (local && local.status === 'paid') {
    const r = { v: 1, oid: o.id, tt: o.total, sn: o.shopName, se: o.shopEmoji, pa: o.payAddress, pn: o.payAddressName, at: local.paidAt || Date.now() };

/* ---------- 回执页 ---------- */
function renderReceipt(encoded) {
  const r = decodeData(encoded);

  if (!r || !r.oid) {
    return `<div class="empty-page">
      <div style="font-size:48px">🔍</div>
      <p>回执数据无法解析</p>
      <button class="primary-btn" onclick="go('#/')">回到首页</button>
    </div>`;
  }

  // 尝试同步本地订单状态
  let synced = false;
  const local = S.orders.find(x => x.id === r.oid);
  if (local && local.status === 'unpaid') {
    local.status = 'paid';
    local.paidAt = r.at || Date.now();
    save();
    synced = true;
  }

  const isOwner = local && local.role === 'owner';

  return `
  <div class="header-bar plain">
    <button class="back-btn dark" onclick="go('#/orders')">‹</button>
    <span style="font-size:16px">支付回执</span>

    <div class="pay-done-title">代付成功</div>
    <div class="pay-done-amount">¥${Number(r.tt).toFixed(2)}</div>
    <div class="pay-done-sub">已支付给「${esc(r.sn)}」</div>
    <div class="pay-done-addr">收款地址：${esc(r.pa)}</div>
    ${synced ? '<div class="sync-note">✓ 本机订单状态已同步为「已支付」</div>' : ''}

    <div class="done-actions">
      <button class="primary-btn" onclick="copyReceiptEncoded('${encoded}')">复制回执链接发给好友</button>
      ${isOwner
        ? `<button class="ghost-btn" onclick="go('#/orders')">查看我的订单</button>`
        : `<button class="ghost-btn" onclick="copyPayFromReceipt('${encoded}')">再次复制代付链接</button>`}
      <button class="ghost-btn" onclick="go('#/')">我也去点一单</button>
    </div>

    <div style="font-size:12px; color:#bbb; margin-top:20px; line-height:1.7">
      把「回执链接」发回给好友，<br>对方打开后订单会自动标记为已支付
    </div>
  </div>`;
}

    ${o.items.map(i => `
      <div class="co-item">
        <span class="co-item-emoji">${i.emoji}</span>
        <span class="co-item-name">${esc(i.name)}</span>
        <span class="co-item-qty">x${i.qty}</span>
        <span class="co-item-price">¥${(i.price * i.qty).toFixed(2)}</span>
      </div>`).join('')}
    <div class="co-line"><span>配送费</span><span>¥${Number(o.deliveryFee).toFixed(2)}</span></div>
    <div class="co-line total"><span>合计</span><span class="price">¥${Number(o.total).toFixed(2)}</span></div>
  </div>`;
}

/* ---------- 订单列表 ---------- */
function renderOrders() {
  if (S.orders.length === 0) {
    return `<div class="empty-page">
      <div style="font-size:48px">📋</div>
      <p>还没有订单</p>
      <button class="primary-btn" onclick="go('#/')">去点一单</button>
    </div>`;
  }

  return `
  <div class="header-bar plain"><span style="font-size:16px">我的订单</span></div>
  <div class="order-list">
    ${S.orders.map(o => {
      const isPayer = o.role === 'payer';
      const statusLabel = o.status === 'paid' ? '已支付' : (o.payMethod === 'friend' ? '待好友代付' : '待支付');
      return `
      <div class="order-card">
        <div class="order-top">
          <span style="min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">
            <span class="order-role ${isPayer ? 'payer' : ''}">${isPayer ? '我代付的' : '我发起的'}</span>
            ${o.shopEmoji} ${esc(o.shopName)}
          </span>
          <span class="order-status ${o.status}">${statusLabel}</span>
        </div>
        <div class="order-items">
          ${o.items.map(i => `${esc(i.name)} ×${i.qty}`).join('、')}
        </div>
        <div class="order-bottom">
          <span>${fmtTime(o.createdAt)} · ${o.payMethod === 'friend' ? '好友代付' : '自己支付'}</span>
          <span class="price">¥${Number(o.total).toFixed(2)}</span>
        </div>
        <div class="order-actions">
          ${o.status === 'unpaid' && o.payMethod === 'friend' && !isPayer
            ? `<button class="mini-btn" onclick="copyPayLink('${o.id}')">复制代付链接</button>` : ''}
          ${o.status === 'unpaid'
            ? `<button class="mini-btn primary" onclick="openPay('${o.id}')">去支付</button>` : ''}
          ${o.status === 'paid' && o.payMethod === 'friend'
            ? `<button class="mini-btn" onclick="copyReceiptLink('${o.id}')">复制回执</button>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------- 设置页 ---------- */
function renderSettings() {
  const s = S.settings;
  const r = s.receiver;

  return `
  <div class="header-bar plain"><span style="font-size:16px">设置</span></div>

  <div class="card">
    <div class="card-title">收款地址</div>
    <div class="field">
      <label>账户名称</label>
      <input type="text" value="${esc(s.payAddressName)}"
             oninput="updateSetting('payAddressName', this.value)"
             placeholder="例如：商户收款钱包">
    </div>
    <div class="field">
      <label>收款地址</label>
      <input type="text" value="${esc(s.payAddress)}"
             oninput="updateSetting('payAddress', this.value)"
             placeholder="钱包地址 / 收款账号">
    </div>
    <div class="hint">代付成功后，款项将结算至该地址。新建订单时自动使用当前地址。</div>
  </div>

  <div class="card">
    <div class="card-title">收货信息</div>
    <div class="field">
      <label>收货人</label>
      <input type="text" value="${esc(r.name)}"
             oninput="updateSetting('receiver.name', this.value)" placeholder="姓名">
    </div>
    <div class="field">
      <label>联系电话</label>
      <input type="tel" value="${esc(r.phone)}"
             oninput="updateSetting('receiver.phone', this.value)" placeholder="手机号">
    </div>
    <div class="field">
      <label>收货地址</label>
      <input type="text" value="${esc(r.address)}"
             oninput="updateSetting('receiver.address', this.value)" placeholder="详细地址">
    </div>
  </div>

  <div class="card">
    <div class="card-title">数据</div>
    <button class="ghost-btn" style="width:100%" onclick="resetAll()">清空全部数据</button>
    <div class="hint">订单与设置保存在本机浏览器；代付链接自带订单数据，可跨设备使用。</div>
  </div>`;
}

/* =========================================================
   启动
   ========================================================= */
window.addEventListener('hashchange', () => render(false));
render(false);
</script>
</body>
</html>
